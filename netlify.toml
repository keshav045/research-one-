# =============================================================================
# Netlify Configuration — ResearchLens Frontend
# =============================================================================

[build]
  command = "npm run build"
  publish = "dist"

# Single Page Application (SPA) routing
# Redirects all navigation requests to index.html so React Router / client routes work
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
